    summary: Food-trust scores from structured hygiene observations — not generic reviews.
    description: A food-trust MVP for consumers, owners, and moderators. Discover places, submit structured hygiene reviews with evidence, claim listings, and see a platform-derived trust score. This lab is a static teaser with canned Berlin data; the real app needs FastAPI and Postgres.
