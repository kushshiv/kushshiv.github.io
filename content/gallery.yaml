      - items:
          - Built a food-trust MVP for consumers, owners, and moderators around structured hygiene, not star ratings.
          - Let people discover places, submit evidence-backed reviews, and claim listings.
          - Derived a platform trust score from hygiene observations instead of generic reviews.
          - Shipped a static Berlin lab teaser; the full app is designed around FastAPI and Postgres.
      - title: "[IN PROGRESS]"
